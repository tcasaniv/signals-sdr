[package]
name = "signals-sdr"
version = "0.3.0"
edition = "2021"
authors = ["Signals SDR Contributors"]
description = "Educational SDR signal generator and modulator suite for satellites (APT, LRPT, SSTV) and analog radio (FM, AM)"
license = "GPL-3.0-or-later"
repository = "https://github.com/apt-tx/signals-sdr"
readme = "README.md"
keywords = ["sdr", "satellite", "noaa-apt", "meteor-lrpt", "sstv"]
categories = ["science", "multimedia"]

[dependencies]
# GUI Framework
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "persistence"] }
egui = { version = "0.36", features = ["serde"] }
egui_extras = { version = "0.36", features = ["image", "file"] }
egui_icons = "0.0.1"

# Codificadores y moduladores locales
apt-encoder = { path = "../apt-encoder-rs" }
lrpt-encoder = { path = "../lrpt-encoder-rs" }
sstv-encoder = { path = "../sstv-encoder-rs" }
fm-modulator = { path = "../fm-modulator-rs" }
am-modulator = { path = "../am-modulator-rs" }

# SDR Hardware Abstraction
seify = { path = "../seify", default-features = false, features = ["dummy"] }

# Procesamiento de audio, imagen y datos comunes
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "webp"] }
hound = "3.5"
symphonia = { version = "0.5.4", features = ["mp3", "wav"] }
num-complex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
log = "0.4"
rfd = "0.15"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
seify = { path = "../seify", default-features = false, features = ["hackrf", "soapy"] }
dirs = "6.0"
env_logger = "0.11"
rodio = "0.23.0"
ureq = "3.3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Document", "Window", "Element", "HtmlCanvasElement",
    "Navigator", "WorkerNavigator",
    "Blob", "BlobPropertyBag", "HtmlAnchorElement", "Url",
    "Response", "Request", "RequestInit", "Headers",
    "Usb", "UsbDevice", "UsbControlTransferParameters", "UsbInTransferResult",
    "UsbOutTransferResult", "UsbDeviceFilter", "UsbDeviceRequestOptions",
    "UsbRecipient", "UsbRequestType", "UsbDirection", "UsbTransferStatus"
] }

[build-dependencies]
winres = "0.1"

[features]
default = ["hackrf", "soapy"]
hackrf = ["seify/hackrf"]
soapy = ["seify/soapy"]
bladerf = ["seify/bladerf1"]
usrp = ["seify/uhd"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
